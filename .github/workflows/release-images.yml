name: release-images

# Builds and publishes the sandbox language images (and the api/worker images)
# to the GitHub Container Registry (ghcr.io/teovillanueva/...).
#
# The language images are built for linux/amd64 — that is the Fly.io / production
# target. Local development builds them natively via `make build-images`.
#
# Trigger manually (`gh workflow run release-images.yml`) or by pushing a `v*` tag.

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Extra tag to also push (e.g. a release version). Optional."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: teovillanueva
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: executor-python
            tag: "3.12"
            context: languages/python-3.12
            dockerfile: languages/python-3.12/Dockerfile
          - name: executor-rust
            tag: "1.83"
            context: languages/rust-1.83
            dockerfile: languages/rust-1.83/Dockerfile
          - name: executor-r
            tag: "4.4"
            context: languages/r-4.4
            dockerfile: languages/r-4.4/Dockerfile
          - name: executor-sqlite
            tag: "3"
            context: languages/sqlite-3
            dockerfile: languages/sqlite-3/Dockerfile
          - name: code-runner-api
            tag: latest
            context: .
            dockerfile: apps/api/Dockerfile
          - name: code-runner-worker
            tag: latest
            context: .
            dockerfile: apps/worker/Dockerfile
    name: ${{ matrix.name }}:${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          base="${REGISTRY}/${OWNER}/${{ matrix.name }}"
          tags="${base}:${{ matrix.tag }}"
          if [ -n "${{ github.event.inputs.tag_suffix }}" ]; then
            tags="${tags},${base}:${{ github.event.inputs.tag_suffix }}"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${base}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.OWNER }}/code-runner
            org.opencontainers.image.description=code-runner ${{ matrix.name }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
