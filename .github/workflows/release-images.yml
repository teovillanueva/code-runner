# release-images.yml — build & publish the code-runner container images to GHCR.
#
# Two artifacts, two cadences:
#
#   service images (code-runner-api, code-runner-worker)
#     - every push to main  → :latest + :sha-<short>   (continuous, immutable sha)
#     - on a vX.Y.Z git tag → :1, :1.2, :1.2.3          (stable, pinnable releases)
#
#   language sandbox images (executor-python, -rust, -r, -sqlite)
#     - only when languages/** changes (or on a tag / manual run)
#     - tagged by language version + an immutable <version>-<sha>
#
# Cut a stable release with:  git tag v1.2.3 && git push origin v1.2.3
# (independent from the npm SDK versions, which are driven by Changesets.)

name: release-images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: teovillanueva
  PLATFORMS: linux/amd64

jobs:
  # Detect whether any language image needs rebuilding (path-gated on main).
  changes:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.filter.outputs.languages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            languages:
              - 'languages/**'

  # Service images — built on every main push (latest + sha) and on v* tags (semver).
  service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: code-runner-api
            dockerfile: apps/api/Dockerfile
          - name: code-runner-worker
            dockerfile: apps/worker/Dockerfile
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
          # `latest` tracks main HEAD (continuous); releases get semver tags.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.OWNER }}/code-runner
            org.opencontainers.image.description=code-runner ${{ matrix.name }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Language images — only when languages/** changed, or on a tag / manual run.
  languages:
    needs: changes
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.languages == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: executor-python
            version: "3.12"
            context: languages/python-3.12
          - name: executor-rust
            version: "1.83"
            context: languages/rust-1.83
          - name: executor-r
            version: "4.4"
            context: languages/r-4.4
          - name: executor-sqlite
            version: "3"
            context: languages/sqlite-3
    name: ${{ matrix.name }}:${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
          flavor: latest=false
          # Stable language-version tag + an immutable <version>-<sha> for pinning.
          tags: |
            type=raw,value=${{ matrix.version }}
            type=sha,prefix=${{ matrix.version }}-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.OWNER }}/code-runner
            org.opencontainers.image.description=code-runner ${{ matrix.name }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Fly worker image — the dind worker, built here so `fly deploy` is a PULL (no
  # remote build): `fly deploy --image ghcr.io/.../code-runner-worker-fly:<tag>`.
  # The language images are NOT baked in — the worker loads them onto its ext4
  # volume (forked from the golden snapshot, or a one-time GHCR pull). Built on
  # every main push (worker code changes); independent of the `languages` job.
  worker-fly:
    runs-on: ubuntu-latest
    name: code-runner-worker-fly
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/code-runner-worker-fly
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.OWNER }}/code-runner
            org.opencontainers.image.description=code-runner Fly dind worker
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/fly/worker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=code-runner-worker-fly
          cache-to: type=gha,mode=max,scope=code-runner-worker-fly
