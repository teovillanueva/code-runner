<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="code-runner — run untrusted code in a hardened, interactive sandbox">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#22252B" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Flat canvas, hairline frame, faint achromatic instrument grid. No gradient, no glow, no shadow. -->
  <rect x="1" y="1" width="1278" height="358" rx="14" fill="#0A0B0D"/>
  <rect x="1" y="1" width="1278" height="358" rx="14" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1277" height="357" rx="13.5" fill="none" stroke="#2E323A"/>

  <!-- LEFT: logomark + wordmark + tagline + tech chips (achromatic) -->
  <!-- /// logomark, opacity fade, ink -->
  <g transform="translate(72 64) scale(0.82)" fill="#F4F5F7">
    <path d="M55.5 0H77.5L58.5 32H36.5L55.5 0Z"/>
    <path d="M35.5 0H51.5L32.5 32H16.5L35.5 0Z" opacity="0.62"/>
    <path d="M19.5 0H31.5L12.5 32H0.5L19.5 0Z" opacity="0.4"/>
  </g>

  <text x="71" y="158" font-family="'Geist','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="58" font-weight="600" letter-spacing="-1.7" fill="#F4F5F7">code-runner</text>

  <text x="73" y="200" font-family="'Geist','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="23" font-weight="500" letter-spacing="-0.2" fill="#A6AAB3">Run untrusted code in a hardened, interactive sandbox.</text>

  <text x="73" y="234" font-family="'Geist Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="0.2" fill="#71757E">Live stdin · real-time output · self-hostable · MIT</text>

  <!-- Tech chips: bordered, no colored dots, ink-2 mono -->
  <g font-family="'Geist Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#A6AAB3">
    <g transform="translate(72 282)">
      <rect width="62" height="28" rx="6" fill="#15171C" stroke="#22252B"/>
      <text x="31" y="18" text-anchor="middle">Hono</text>
    </g>
    <g transform="translate(144 282)">
      <rect width="46" height="28" rx="6" fill="#15171C" stroke="#22252B"/>
      <text x="23" y="18" text-anchor="middle">Go</text>
    </g>
    <g transform="translate(200 282)">
      <rect width="66" height="28" rx="6" fill="#15171C" stroke="#22252B"/>
      <text x="33" y="18" text-anchor="middle">Redis</text>
    </g>
    <g transform="translate(276 282)">
      <rect width="70" height="28" rx="6" fill="#15171C" stroke="#22252B"/>
      <text x="35" y="18" text-anchor="middle">soketi</text>
    </g>
    <g transform="translate(356 282)">
      <rect width="74" height="28" rx="6" fill="#15171C" stroke="#22252B"/>
      <text x="37" y="18" text-anchor="middle">Docker</text>
    </g>
  </g>

  <!-- RIGHT: Emphasis-panel terminal — the live stdin/stdout round-trip. Iris rationed to the typed input + caret + running dot. -->
  <g transform="translate(792 70)">
    <rect width="416" height="220" rx="10" fill="#15171C" stroke="#22252B"/>
    <!-- header band -->
    <rect width="416" height="38" rx="10" fill="#0F1114"/>
    <rect y="24" width="416" height="14" fill="#0F1114"/>
    <line x1="0" y1="38" x2="416" y2="38" stroke="#22252B"/>
    <circle cx="22" cy="19" r="4" fill="#2E323A"/>
    <circle cx="40" cy="19" r="4" fill="#2E323A"/>
    <circle cx="58" cy="19" r="4" fill="#2E323A"/>
    <text x="208" y="23.5" text-anchor="middle" font-family="'Geist Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#71757E">private-run-9f2a · python 3.12</text>

    <g font-family="'Geist Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
      <!-- source line -->
      <text x="22" y="80" xml:space="preserve"><tspan fill="#71757E">› </tspan><tspan fill="#F4F5F7">name = input(</tspan><tspan fill="#A6AAB3">"name? "</tspan><tspan fill="#F4F5F7">)</tspan></text>
      <!-- live stdin: typed value + caret in iris -->
      <text x="22" y="108" xml:space="preserve"><tspan fill="#71757E">name? </tspan><tspan fill="#6D63FF">World</tspan></text>
      <rect x="116" y="96" width="8" height="16" fill="#6D63FF"/>
      <!-- stdout -->
      <text x="22" y="136" xml:space="preserve"><tspan fill="#71757E">stdout </tspan><tspan fill="#F4F5F7">hello World</tspan></text>

      <!-- status row -->
      <line x1="22" y1="156" x2="394" y2="156" stroke="#22252B"/>
      <circle cx="27" cy="180" r="4.5" fill="#6D63FF"/>
      <text x="40" y="184" fill="#A6AAB3">running · 312ms · stdin open</text>
    </g>
  </g>
</svg>
