<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="code-runner — run untrusted code in a hardened, interactive sandbox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 70) rotate(38) scale(620 420)">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1f2a3a" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="19.5" fill="none" stroke="#1f2937" stroke-opacity="0.8"/>

  <!-- Left: wordmark + tagline -->
  <g transform="translate(72 116)">
    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace">
      <text x="0" y="0" font-size="22" fill="#34d399" letter-spacing="6">$ EXECUTE</text>
      <text x="0" y="64" font-size="68" font-weight="700" fill="#e6edf3">code-runner</text>
      <rect x="448" y="22" width="26" height="52" rx="3" fill="url(#accent)"/>
    </g>
    <text x="2" y="116" font-family="'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="25" fill="#aeb9c4" font-weight="500">Run untrusted code in a hardened, interactive sandbox.</text>
    <text x="2" y="154" font-family="'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" fill="#6b7a89">Live stdin · real-time output · self-hostable · MIT</text>

    <g transform="translate(2 184)" font-family="'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" fill="#cdd7e0" font-weight="600">
      <g>
        <rect x="0" y="-20" width="116" height="30" rx="15" fill="#0d1117" stroke="#243042"/>
        <circle cx="20" cy="-5" r="4" fill="#34d399"/>
        <text x="34" y="-1">Hono · Go</text>
      </g>
      <g transform="translate(130 0)">
        <rect x="0" y="-20" width="98" height="30" rx="15" fill="#0d1117" stroke="#243042"/>
        <circle cx="20" cy="-5" r="4" fill="#22d3ee"/>
        <text x="34" y="-1">Redis</text>
      </g>
      <g transform="translate(242 0)">
        <rect x="0" y="-20" width="112" height="30" rx="15" fill="#0d1117" stroke="#243042"/>
        <circle cx="20" cy="-5" r="4" fill="#a78bfa"/>
        <text x="34" y="-1">soketi</text>
      </g>
      <g transform="translate(368 0)">
        <rect x="0" y="-20" width="132" height="30" rx="15" fill="#0d1117" stroke="#243042"/>
        <circle cx="20" cy="-5" r="4" fill="#f59e0b"/>
        <text x="34" y="-1">Docker</text>
      </g>
    </g>
  </g>

  <!-- Right: terminal card -->
  <g transform="translate(792 70)" filter="url(#soft)">
    <rect width="416" height="220" rx="14" fill="#0d1117" stroke="#1f2937"/>
    <rect width="416" height="40" rx="14" fill="#11161f"/>
    <rect y="26" width="416" height="14" fill="#11161f"/>
    <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="70" cy="20" r="6" fill="#27c93f"/>
    <text x="208" y="25" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#5a6b7b">private-run-9f2a · python 3.12</text>

    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace" font-size="15.5">
      <text x="22" y="78" fill="#7c8ea0">›</text>
      <text x="42" y="78" fill="#e6edf3">name = input(</text>
      <text x="178" y="78" fill="#f0a35e">"name? "</text>
      <text x="248" y="78" fill="#e6edf3">)</text>

      <text x="22" y="106" fill="#34d399">name?</text>
      <text x="86" y="106" fill="#e6edf3">World</text>
      <rect x="150" y="93" width="9" height="18" fill="#34d399" fill-opacity="0.9"/>

      <text x="22" y="134" fill="#22d3ee">stdout</text>
      <text x="96" y="134" fill="#e6edf3">hello World</text>

      <text x="22" y="172" fill="#7c8ea0">result</text>
      <text x="96" y="172" fill="#8b98a5">exitCode=0 · 312ms · clean</text>
    </g>
    <rect x="0" y="200" width="416" height="20" rx="14" fill="#0b1018"/>
    <rect x="14" y="206" width="120" height="6" rx="3" fill="url(#accent)"/>
  </g>
</svg>
