<svg width="1280" height="220" viewBox="0 0 1280 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="@teovilla/code-runner-contract">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e14"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 40) rotate(150) scale(460 300)">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1f2a3a" stroke-width="1" stroke-opacity="0.4"/></pattern>
  </defs>
  <rect width="1280" height="220" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="220" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="220" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="219" rx="17.5" fill="none" stroke="#1f2937" stroke-opacity="0.8"/>
  <rect x="0" y="0" width="6" height="220" rx="3" fill="url(#ac)"/>

  <g transform="translate(64 70)" font-family="'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace">
    <g>
      <rect x="0" y="-26" width="234" height="30" rx="15" fill="#0d1117" stroke="#243042"/>
      <circle cx="20" cy="-11" r="4.5" fill="#a78bfa"/>
      <text x="34" y="-7" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="700" fill="#cdd7e0" letter-spacing="1">JSON SCHEMA → TS · ZOD · GO</text>
    </g>
    <text x="0" y="48" font-size="40" font-weight="700" fill="#e6edf3">code-runner-contract</text>
    <text x="2" y="86" font-family="'Inter',system-ui,sans-serif" font-size="19" fill="#9fb0bf">One wire contract, generated for every language in the stack.</text>
  </g>

  <!-- right glyph: braces -->
  <g transform="translate(1060 64)" font-family="'JetBrains Mono',monospace">
    <text x="0" y="78" font-size="120" font-weight="700" fill="url(#ac)" opacity="0.92">{ }</text>
  </g>
</svg>
