# Hono API gateway. PRIVATE by design (the executor is never internet-facing —
# your upstream backend calls it). It listens on 8080 and is reachable at
# code-runner-api.internal:8080 over 6PN, or locally via `fly proxy 8080 -a code-runner-api`.
# Auth is the EXECUTOR_API_TOKEN bearer. To expose it publicly (gated by the
# token), add an [http_service] block with internal_port 8080 + force_https.
app = "code-runner-api"
primary_region = "gru"

# Build context is the repo root (the monorepo). Run from there:
#   fly deploy -c deploy/fly/api/fly.toml --dockerfile apps/api/Dockerfile .
[build]
  dockerfile = "../../../apps/api/Dockerfile"

[env]
  API_PORT = "8080"
  REDIS_URL = "redis://code-runner-redis.internal:6379"
  SOKETI_HOST = "code-runner-soketi.internal"
  SOKETI_PORT = "6001"
  SOKETI_USE_TLS = "false"
  SOKETI_APP_ID = "code-runner"
  SOKETI_APP_KEY = "code-runner-key"
  MAX_QUEUE_DEPTH = "256"
  # Expiry (seconds) on job:<id>:spec and the initial job:<id>:status. The worker
  # re-applies the same JOB_TTL on every status write — keep both apps in sync.
  JOB_TTL = "3600"
  ENABLE_CHANNEL_AUTH = "true"
  # Secrets (fly secrets set -a code-runner-api):
  #   EXECUTOR_API_TOKEN, SOKETI_APP_SECRET

# Public gateway, gated by the EXECUTOR_API_TOKEN bearer. force_https redirects
# http->https. Kept always-warm (min 1, no auto-stop): "suspend" froze the
# long-lived Redis TCP socket, so on resume the first ops hit ECONNRESET and the
# job `start` publish to ctrl:<id> was lost — workers warmup-timed-out and batch
# runs 45s-PollTimeout'd to 500. Always-on keeps the Redis connection alive.
#
# Run TWO Machines (`fly scale count 2 -a code-runner-api`, once; deploys keep
# the count). The API is stateless — queue, job state, rate limits and the
# start flag all live in Redis — so any replica serves any request, and a
# second one survives a Machine restart or a saturated sibling.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# Fly scrapes this into the org's managed Prometheus, exposing
# code_runner_queue_depth (LLEN jobs:queue) for fly-autoscaler to scale the
# worker fleet. The endpoint is unauthenticated and lives outside /v1/*. NOTE:
# with min_machines_running=0 the metric is only present while the API is up
# (i.e. while there's traffic / a queue) — fine for autoscaling, since an idle
# API means an empty queue. Set min_machines_running=1 for snappier reaction.
[metrics]
  port = 8080
  path = "/metrics"

# shared-cpu-1x is plenty: the gateway only moves JSON to/from Redis. Measured
# on 2026-09-29 (84 students in an exam): 2-6 % of one core in normal operation,
# peaking at ~30 % only while the worker fleet was saturated and clients were
# polling a 256-deep queue. 256 MB left ~40 MB free; 512 MB gives headroom.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
