# soketi — Pusher-compatible WebSocket server. THE ONLY public app: browsers
# subscribe to private-run-<jobId> over wss to receive output. Trigger (from the
# worker) happens privately over 6PN. Change primary_region to one near you.
app = "code-runner-soketi"
primary_region = "gru"

[build]
  image = "quay.io/soketi/soketi:latest-16-alpine"

[env]
  SOKETI_DEFAULT_APP_ID = "code-runner"
  SOKETI_DEFAULT_APP_KEY = "code-runner-key"
  SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES = "false"
  SOKETI_DEBUG = "0"
  # Bind dual-stack (default is IPv4-only 0.0.0.0). `::` with Linux bindv6only=0
  # accepts BOTH the public proxy path (IPv4) and the private 6PN path (IPv6),
  # so the worker can trigger soketi directly over `code-runner-soketi.internal:6001`
  # — no flycast, no TLS, fully private. Without this, `.internal` (IPv6) is
  # refused and the worker→soketi publish fails (output never reaches clients).
  SOKETI_HOST = "::"
  # SOKETI_DEFAULT_APP_SECRET is set via: fly secrets set -a code-runner-soketi SOKETI_DEFAULT_APP_SECRET=...

[http_service]
  internal_port = 6001
  force_https = true
  # soketi must stay up: the worker publishes output over the private 6PN
  # (.internal), which does NOT trigger Fly's auto-start. Suspending it would
  # drop output events (connection refused). Keep it always-on.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
