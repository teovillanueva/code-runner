# Worker — runs its OWN dockerd inside the Fly Machine (Camino C) and launches
# hardened sandboxes against it. PRIVATE only (no public service).
#
# REQUIRES a volume for /var/lib/docker: dockerd's overlay2 store needs an ext4
# backing fs, and the Machine's rootfs is overlayfs (overlay2 won't start on it).
# Verified on Fly 2026-06-04. So the worker is NOT volume-less.
#
# NEAR-INSTANT COLD START: new pool machines get their docker_data volume FORKED
# from a golden snapshot (already holds the images + the load marker), so boot
# skips the slow store-populate and dockerd is up in seconds. Build/refresh the
# golden snapshot and pre-create snapshot-backed volumes with
# deploy/fly/worker/provision-pool.sh. The autoscaler only start/stops this
# PRE-CREATED pool (FAS_STARTED_MACHINE_COUNT), so machine creation — the only
# slow-without-snapshot step — is an operator/pre-warm action, not a runtime one.
#
# DEPLOY = PULL (no Fly build). The image is built in GitHub CI and published to
# GHCR. Deploy the prebuilt image:
#   fly deploy -c deploy/fly/worker/fly.toml \
#     --image ghcr.io/teovillanueva/code-runner-worker-fly:latest
# Pin an immutable :sha-<short> tag for reproducible releases; `fly releases -a
# code-runner-worker` + redeploying the previous --image rolls back.
app = "code-runner-worker"
primary_region = "gru"

# Graceful drain: on SIGTERM (scale-down / deploy) the worker stops claiming new
# jobs but lets in-flight sandboxes finish (worker Drain). Fly must wait at least
# that long before SIGKILL or it would kill active sessions anyway. The invariant
# is kill_timeout >= WORKER_DRAIN_TIMEOUT_MS >= maxWall (the longest session the
# API allows). Worker is cpu_kind=performance so Fly permits kill_timeout far
# above the old 130s. Set generous: drain 300s (WORKER_DRAIN_TIMEOUT_MS below),
# kill_timeout 330s > drain — so a scale-down/deploy NEVER SIGKILLs a live exam
# session. NOTE: also cap wallTimeMs server-side in the API at <= 300s (reject>cap)
# so a session can never outlast the drain (DECISIONS-prod-launch D3).
kill_timeout = "330s"

[env]
  REDIS_URL = "redis://code-runner-redis.internal:6379"
  # The worker→soketi trigger stays private (trust boundary: soketi is
  # output-only toward clients; the public edge never receives trusted input).
  # soketi binds dual-stack (`SOKETI_HOST=::` in its fly.toml), so the worker
  # triggers it directly over Fly's 6PN private network at
  # `code-runner-soketi.internal:6001` — plain HTTP, no TLS, no flycast, no
  # public exposure. (The earlier flycast/`force_https` path failed: the private
  # proxy doesn't terminate TLS → `Post https://...flycast:443: EOF`.)
  SOKETI_HOST = "code-runner-soketi.internal"
  SOKETI_PORT = "6001"
  SOKETI_USE_TLS = "false"
  SOKETI_APP_ID = "code-runner"
  SOKETI_APP_KEY = "code-runner-key"
  # Benchmarked on perf-2x/4GB (2026-06-04): RAM is the hard ceiling — ~30
  # memory-active Python sandboxes (~110 MB each) before OOM; idle sessions are
  # ~10 MB so 140+ fit; the 2 CPUs never bound the slot count. 24 leaves headroom
  # under the ~30 ceiling. Flat slot count (NOT memory-weighted), so a burst of
  # heavy R(256MB)/Rust(512MB) jobs can still pressure RAM. For more density,
  # raise VM RAM + this together (≈50 on perf-2x/8GB).
  WORKER_MAX_SANDBOXES = "24"
  # Graceful-drain budget (DECISIONS-prod-launch D3). Must satisfy
  # kill_timeout(330s) >= WORKER_DRAIN_TIMEOUT_MS(300s) >= maxWall. The worker
  # drains in-flight sandboxes up to this long on SIGTERM before exiting, so a
  # scale-down/deploy never cuts a live session short.
  WORKER_DRAIN_TIMEOUT_MS = "300000"
  SANDBOX_IMAGE_REGISTRY = "ghcr.io/teovillanueva"
  # Prometheus scrape port (slots_used/_max + queue_depth) for in-flight autoscaling.
  WORKER_METRICS_PORT = "9091"
  # ── Artifacts retention TTLs (Phase 9, D-11) — NON-secret config ──
  # Object TTL is in DAYS; the two URL/result TTLs are in SECONDS. The object TTL
  # MUST be >= the presigned-URL TTL or the worker fails fast at boot (R15). S3
  # lifecycle granularity is whole DAYS (sub-day cleanup is not achievable).
  RUN_RESULT_TTL = "600"
  PRESIGNED_URL_TTL = "86400"
  ARTIFACT_S3_OBJECT_TTL = "3"
  # Secrets (fly secrets set -a code-runner-worker):
  #   SOKETI_APP_SECRET
  #   GHCR_TOKEN  — only needed if the ghcr.io/teovillanueva/executor-* packages are PRIVATE
  #                 (make them public once and you can drop this)
  # ── Tigris (object storage) creds — injected as SECRETS by `fly storage create`
  #    onto THIS worker app (never put them in [env], never commit them). The
  #    same S3Store reads these standard AWS_* names with zero translation:
  #   BUCKET_NAME
  #   AWS_ACCESS_KEY_ID
  #   AWS_SECRET_ACCESS_KEY
  #   AWS_ENDPOINT_URL_S3
  #   AWS_REGION
  # The API app needs NONE of these — only the worker uploads/signs/lifecycles.
  # The worker auto-creates the Tigris bucket on boot if absent (S3Store.EnsureLifecycle).

# Volume for /var/lib/docker (MANDATORY — overlay2 needs ext4; the rootfs is
# overlayfs). Holds the language images (~a few GB, shrunk by the trimmed images)
# plus the overlay upper-dirs of up to WORKER_MAX_SANDBOXES live containers.
# New machines should attach a volume FORKED FROM THE GOLDEN SNAPSHOT (Fly
# attaches an existing unattached docker_data volume before creating an empty
# one) — provision-pool.sh pre-creates those. An empty/unforked volume still
# works; it just pays the one-time GHCR bootstrap on its first boot. 40 GB gives
# generous headroom; the store itself needs only a few GB.
[mounts]
  source = "docker_data"
  destination = "/var/lib/docker"

# Fly scrapes this into the org's managed Prometheus: code_runner_slots_used/_max
# (this node's in-flight) + code_runner_queue_depth (global). fly-autoscaler scales
# the fleet on in-flight = sum(slots_used) + max(queue_depth), so scaling DOWN only
# happens when sessions actually end — it never stops a node mid-session.
[metrics]
  port = 9091
  path = "/metrics"

# Sized for 20 concurrent sandboxes: dedicated CPUs (accurate CPU-clock accounting,
# no noisy-neighbour) + memory for 20 × ~128 MB sandboxes plus dockerd/OS (~1.2 GB).
# The language images sit on the volume (disk), not RAM. The autoscaler adds
# more nodes under load; scale this VM up + WORKER_MAX_SANDBOXES together for
# fewer/bigger nodes (e.g. performance/4cpu/8192 for ~45 sandboxes).
[[vm]]
  cpu_kind = "performance"
  cpus = 2
  memory_mb = 4096
