# code-runner local dev stack
#
# Topology:
#   redis    — job queue + stdin/ctrl pub/sub + job meta
#   soketi   — Pusher-compatible WebSocket server (output fan-out only)
#   api      — Hono gateway (validate, enqueue, relay stdin/control)
#   worker   — Go worker (claim jobs, launch sandboxes, stream output)
#   stub     — Node/TS interactive E2E driver (run on demand)
#
# IMPORTANT: The worker mounts the HOST Docker socket (/var/run/docker.sock)
# so it can launch sandboxes via the host daemon — NO Docker-in-Docker.
#
# IMPORTANT: The Python sandbox image (executor/python:3.12) must be built on
# the host daemon BEFORE the worker can run Python jobs.
# Build it with:   make python-image
# This image is NOT built here because it lives on the host runtime that the
# worker's mounted socket points at; building it in compose would put it inside
# the compose network's build context only.
#
# The soketi APP_SECRET is read from env and passed to soketi + worker/api
# directly. It is NEVER written to Redis or returned by any endpoint (CFG-02/03).

services:

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - code-runner
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── soketi ───────────────────────────────────────────────────────────────────
  # Pusher-compatible WebSocket server. The worker publishes events here via the
  # Pusher HTTP API (no soketi secret ever touches Redis or client requests).
  # Channel auth (private-run-<jobId>) is the upstream app's responsibility;
  # the stub uses the API's optional channel-auth helper (ENABLE_CHANNEL_AUTH=true).
  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    restart: unless-stopped
    environment:
      SOKETI_DEFAULT_APP_ID: ${SOKETI_APP_ID:-code-runner}
      SOKETI_DEFAULT_APP_KEY: ${SOKETI_APP_KEY:-code-runner-key}
      SOKETI_DEFAULT_APP_SECRET: ${SOKETI_APP_SECRET:-code-runner-secret}
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "false"
      SOKETI_DEBUG: "0"
    # soketi is on the internal docker network; the stub connects via the
    # service name "soketi:6001" — no host port needed for the E2E.
    # Expose to host only for external client development (optional, may conflict
    # if another soketi instance is already running on the host).
    # To expose: add  ports: ["${SOKETI_PORT:-6001}:6001"]  here.
    networks:
      - code-runner
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:6001/', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────────
  # Dev backend for the worker's artifact store (Phase 9, R14). The worker points
  # AWS_ENDPOINT_URL_S3 at http://minio:9000 and uploads run artifacts here.
  #
  # NO separate bucket-create init container: the worker's S3Store.EnsureLifecycle
  # (plan 02) calls BucketExists + MakeBucket-if-absent on boot, so the bucket
  # ${BUCKET_NAME} is auto-created against a FRESH MinIO. The same code runs
  # unmodified against Tigris in prod (see docs/deploy-fly.md).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # Expose to host only for local dev (S3 API on 9000, web console on 9001).
    # Commented like soketi's optional ports to avoid clashing with a host MinIO.
    # To expose: uncomment the ports block below.
    # ports:
    #   - "9000:9000" # S3 API
    #   - "9001:9001" # web console (http://localhost:9001)
    volumes:
      - minio_data:/data
    networks:
      - code-runner
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ── API ───────────────────────────────────────────────────────────────────────
  # Hono gateway. Validates requests, enqueues jobs, relays stdin/control.
  # Never talks to the worker directly — coupling is Redis-only.
  # NOTE: for ARTIFACTS the API needs no S3 creds (the worker uploads/signs those).
  # For CAS BLOBS (Phase 16) the API PRESIGNS upload PUT URLs — that is pure LOCAL
  # crypto (no S3 network call, no byte proxying), so it carries blob presign
  # config (public endpoint + bucket + creds). Existence is checked in Redis; the
  # worker remains the only party that reads/writes blob bytes + verifies sha256.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      EXECUTOR_API_TOKEN: ${EXECUTOR_API_TOKEN:-dev-insecure-token-change-me}
      REDIS_URL: redis://redis:6379
      API_PORT: ${API_PORT:-8080}
      SOKETI_HOST: soketi
      SOKETI_PORT: 6001
      SOKETI_USE_TLS: "false"
      SOKETI_APP_ID: ${SOKETI_APP_ID:-code-runner}
      SOKETI_APP_KEY: ${SOKETI_APP_KEY:-code-runner-key}
      SOKETI_APP_SECRET: ${SOKETI_APP_SECRET:-code-runner-secret}
      ENABLE_CHANNEL_AUTH: "true"
      # The languages dir inside the container (bound via the build context)
      LANGUAGES_DIR: /app/languages
      # ── Content-addressed blob store presign (Phase 16, BLOB-02) ──
      # The API presigns blob PUT URLs (local crypto only). Presign against the
      # PUBLIC endpoint the SDK can reach. In dev the SDK runs on the HOST, so the
      # public endpoint must be a host-reachable address — set
      # BLOB_S3_PUBLIC_ENDPOINT to e.g. http://127.0.0.1:9000 in .env AND expose
      # the MinIO 9000 port (uncomment the minio `ports:` block below). When unset,
      # the /v1/blobs/* routes return 501 and transparent CAS is disabled — a plain
      # `docker compose up` stays a no-op (mirrors telemetry-off-by-default).
      BLOB_S3_PUBLIC_ENDPOINT: ${BLOB_S3_PUBLIC_ENDPOINT:-}
      BLOB_S3_BUCKET: ${BLOB_S3_BUCKET:-${BUCKET_NAME:-code-runner-artifacts}}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BLOB_IDLE_TTL: ${BLOB_IDLE_TTL:-86400}
      # ── OpenTelemetry (no-op unless OTEL_EXPORTER_OTLP_ENDPOINT is set) ──
      # Blank by default → the API SDK bootstrap is a TRUE no-op (no exporter,
      # no connection). Uncomment the OTEL_* block in .env to enable, then run
      # the `observability` profile below to receive + view the data in Jaeger.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_API:-code-runner-api}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=code-runner}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-}
    depends_on:
      redis:
        condition: service_healthy
      soketi:
        condition: service_healthy
    networks:
      - code-runner
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${API_PORT:-8080}/health', (r) => { let d=''; r.on('data', c=>d+=c); r.on('end', ()=>{ try{ const j=JSON.parse(d); process.exit(j.status==='ok'?0:1); }catch(e){ process.exit(1); } }); }).on('error', ()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Worker ───────────────────────────────────────────────────────────────────
  # Go worker. Claims jobs from Redis, launches sandboxes via the HOST Docker
  # daemon (mounted socket — no DinD), streams output to soketi.
  #
  # Socket mount: /var/run/docker.sock:/var/run/docker.sock
  #   The worker is a CLIENT of the host daemon, not running its own Docker.
  #   This means executor/python:3.12 must exist on the HOST daemon.
  #   Run `make python-image` on the host before `make e2e`.
  #
  # Languages dir: ./languages is mounted read-only so the worker can load
  #   manifests (language definitions) from the same source tree.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      SOKETI_HOST: soketi
      SOKETI_PORT: 6001
      SOKETI_USE_TLS: "false"
      SOKETI_APP_ID: ${SOKETI_APP_ID:-code-runner}
      SOKETI_APP_KEY: ${SOKETI_APP_KEY:-code-runner-key}
      SOKETI_APP_SECRET: ${SOKETI_APP_SECRET:-code-runner-secret}
      WORKER_MAX_SANDBOXES: ${WORKER_MAX_SANDBOXES:-8}
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
      WORKER_WARMUP_MS: ${WORKER_WARMUP_MS:-30000}
      LANGUAGES_DIR: /app/languages
      SECCOMP_PROFILE_PATH: /app/profiles/seccomp/runner.json
      # ── Artifacts / S3 object storage (Phase 9, D-03) ──
      # Point the worker's S3Store at the dev MinIO service. The bucket is
      # AUTO-CREATED by the worker on boot (S3Store.EnsureLifecycle) — there is
      # deliberately NO separate bucket-create init container. Standard AWS_* env;
      # ARTIFACT_S3_* overrides exist (see .env.example) but are unused in dev.
      AWS_ENDPOINT_URL_S3: http://minio:9000
      BUCKET_NAME: ${BUCKET_NAME:-code-runner-artifacts}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Retention TTLs (D-11). Object TTL (days) MUST be >= presigned-URL TTL
      # (seconds) or the worker fails fast at boot (R15 ordering invariant).
      RUN_RESULT_TTL: ${RUN_RESULT_TTL:-600}
      PRESIGNED_URL_TTL: ${PRESIGNED_URL_TTL:-86400}
      ARTIFACT_S3_OBJECT_TTL: ${ARTIFACT_S3_OBJECT_TTL:-3}
      # ── Content-addressed blob store (Phase 16, CAS) ──
      # Blobs REUSE the artifact S3 endpoint/creds/region above; bytes live under
      # the blobs/cas/ prefix. BLOB_S3_BUCKET (BYO-bucket) defaults to BUCKET_NAME
      # so blobs + artifacts share one bucket in dev. Liveness lives in Redis;
      # the worker is the authoritative sha256 verifier on pull + runs the GC.
      BLOB_S3_BUCKET: ${BLOB_S3_BUCKET:-}
      BLOB_IDLE_TTL: ${BLOB_IDLE_TTL:-86400}
      BLOB_GC_INTERVAL: ${BLOB_GC_INTERVAL:-600}
      BLOB_GC_GRACE: ${BLOB_GC_GRACE:-1800}
      # ── OpenTelemetry (no-op unless OTEL_EXPORTER_OTLP_ENDPOINT is set) ──
      # Blank by default → the worker OTel init is a TRUE no-op (no exporter,
      # no provider, no port). Uncomment the OTEL_* block in .env + run the
      # `observability` profile to emit the worker's linked spans + metrics.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_WORKER:-code-runner-worker}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=code-runner}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-}
    volumes:
      # Mount the HOST docker socket (no Docker-in-Docker).
      # The worker is a client of the host container runtime.
      # executor/python:3.12 MUST be built on the host first (`make python-image`).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      soketi:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - code-runner

  # ── Stub ─────────────────────────────────────────────────────────────────────
  # Interactive E2E driver. Plays the role of the upstream app:
  #   POST /v1/execute → subscribe soketi → POST /start → send stdin → assert result.
  # Run on demand (not auto-started with the stack):
  #   docker compose run --rm stub
  stub:
    build:
      context: .
      dockerfile: apps/stub/Dockerfile
    environment:
      EXECUTOR_API_TOKEN: ${EXECUTOR_API_TOKEN:-dev-insecure-token-change-me}
      API_BASE_URL: http://api:${API_PORT:-8080}
      SOKETI_APP_KEY: ${SOKETI_APP_KEY:-code-runner-key}
      SOKETI_APP_SECRET: ${SOKETI_APP_SECRET:-code-runner-secret}
      SOKETI_HOST: soketi
      SOKETI_PORT: 6001
      SOKETI_USE_TLS: "false"
      # Channel auth endpoint on the API (CHAN-02 helper)
      CHANNEL_AUTH_URL: http://api:${API_PORT:-8080}/v1/channel-auth
    depends_on:
      api:
        condition: service_healthy
      soketi:
        condition: service_healthy
    networks:
      - code-runner
    profiles:
      - stub

  # ── OpenTelemetry Collector ──────────────────────────────────────────────────
  # Example BYO observability backend. INERT on a plain `docker compose up` — it
  # only starts under the `observability` profile (mirrors the `stub` mechanism):
  #   docker compose --profile observability up
  # Receives OTLP from the api + worker (set OTEL_EXPORTER_OTLP_ENDPOINT=
  # http://otel-collector:4318 in .env), forwards traces to Jaeger and prints
  # metrics+logs via the debug exporter. Config: ./observability/otel-collector.yaml.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - code-runner
    profiles:
      - observability

  # ── Jaeger (all-in-one) ──────────────────────────────────────────────────────
  # The example trace backend (D-08). Native OTLP ingest + built-in UI on 16686.
  # INERT by default; starts only with `--profile observability`.
  #   UI: http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
    networks:
      - code-runner
    profiles:
      - observability

networks:
  code-runner:
    driver: bridge

volumes:
  # Persists dev artifacts across `docker compose` restarts. The bucket inside
  # is auto-created by the worker on boot (S3Store.EnsureLifecycle) — no init step.
  minio_data:
